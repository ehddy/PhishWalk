name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phishwalk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run core regression tests
        run: |
          python -m agent.test.test_action_accounting
          python -m agent.test.test_decision_recovery
          python -m agent.test.test_finalize
          python -m agent.test.test_observation_accounting
          python -m agent.test.test_one_shot
          python -m agent.test.test_run_metadata

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          cp targets.example.txt targets.txt
          docker compose config --quiet
